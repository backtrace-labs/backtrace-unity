name: Build package

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-macos-framework-layout:
    name: Validate macOS framework layout
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Backtrace.framework layout in repo
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORK="Mac/BacktraceMacUnity.bundle/Contents/Frameworks/Backtrace.framework"

          test -d "$FRAMEWORK"
          test -d "$FRAMEWORK/Versions/A"
          test -f "$FRAMEWORK/Versions/A/Backtrace"
          test -f "$FRAMEWORK/Versions/A/Resources/Info.plist"

          test -L "$FRAMEWORK/Versions/Current"
          test "$(readlink "$FRAMEWORK/Versions/Current")" = "A"

          test -L "$FRAMEWORK/Backtrace"
          test "$(readlink "$FRAMEWORK/Backtrace")" = "Versions/Current/Backtrace"

          test -L "$FRAMEWORK/Resources"
          test "$(readlink "$FRAMEWORK/Resources")" = "Versions/Current/Resources"

          test ! -e "$FRAMEWORK/A"

      - name: Validate packaged macOS framework layout
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          PACKAGE_ROOT="$WORKDIR/package-root"
          mkdir -p "$PACKAGE_ROOT"

          cp -R Editor Runtime Tests Android iOS Mac Windows package.json "$PACKAGE_ROOT/"

          tar -czf "$WORKDIR/io.backtrace.unity.tgz" -C "$PACKAGE_ROOT" .

          EXTRACT_DIR="$WORKDIR/extracted"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$WORKDIR/io.backtrace.unity.tgz" -C "$EXTRACT_DIR"

          FRAMEWORK="$EXTRACT_DIR/Mac/BacktraceMacUnity.bundle/Contents/Frameworks/Backtrace.framework"

          test -d "$FRAMEWORK"
          test -d "$FRAMEWORK/Versions/A"
          test -f "$FRAMEWORK/Versions/A/Backtrace"
          test -f "$FRAMEWORK/Versions/A/Resources/Info.plist"

          test -L "$FRAMEWORK/Versions/Current"
          test "$(readlink "$FRAMEWORK/Versions/Current")" = "A"

          test -L "$FRAMEWORK/Backtrace"
          test "$(readlink "$FRAMEWORK/Backtrace")" = "Versions/Current/Backtrace"

          test -L "$FRAMEWORK/Resources"
          test "$(readlink "$FRAMEWORK/Resources")" = "Versions/Current/Resources"

          test ! -e "$FRAMEWORK/A"

  test:
    needs: validate-macos-framework-layout
    name: Run Build for ${{ matrix.unityVersion }} ${{ matrix.unityVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - test-package
        unityVersion:
          - 2019.4.40f1
        targetPlatform:
          - StandaloneOSX
          - StandaloneWindows
          - StandaloneWindows64
          - StandaloneLinux64
          - iOS
          - Android
          - WebGL
        # The Android bridge touches native plugin loading, P/Invoke marshalling, and App Bundle packaging, Android players also build on modern Unity versions.
        # Other platforms are unaffected and stay on the single baseline version.
        include:
          - projectPath: test-package
            unityVersion: 2022.3.56f1
            targetPlatform: Android
          - projectPath: test-package
            unityVersion: 6000.3.7f1
            targetPlatform: Android

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Environment
        run: |
          mkdir ${{ matrix.projectPath }}
          mv Editor Runtime Tests Android iOS Mac Windows package.json ${{ matrix.projectPath }}/

      # The synthetic project has no saved scene, and game-ci then builds the untitled scene.
      # Unity 2019.4 tolerates that but 2022.3+ fails with "Cannot build untitled scene", this gives the build a registered empty scene.
      - name: Create CI build scene
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Scenes ${{ matrix.projectPath }}/ProjectSettings
          printf '%%YAML 1.1\n%%TAG !u! tag:unity3d.com,2011:\n' > ${{ matrix.projectPath }}/Assets/Scenes/Empty.unity
          cat > ${{ matrix.projectPath }}/Assets/Scenes/Empty.unity.meta <<'EOF'
          fileFormatVersion: 2
          guid: 9fc0d4010bbf28b4594072e72b8655ab
          DefaultImporter:
            externalObjects: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
          cat > ${{ matrix.projectPath }}/ProjectSettings/EditorBuildSettings.asset <<'EOF'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!1045 &1
          EditorBuildSettings:
            m_ObjectHideFlags: 0
            serializedVersion: 2
            m_Scenes:
            - enabled: 1
              path: Assets/Scenes/Empty.unity
              guid: 9fc0d4010bbf28b4594072e72b8655ab
            m_configObjects: {}
          EOF

      - if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: game-ci/unity-builder@v4
        name: Build game for platform ${{ matrix.targetPlatform }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: ${{ matrix.projectPath }}/
          allowDirtyBuild: true
          