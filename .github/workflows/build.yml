name: Build package

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-apple-native-artifacts:
    name: Validate Apple native artifacts
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash .github/scripts/validate-apple-artifacts.sh . all
      - name: Validate package round trip
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          COPYFILE_DISABLE=1 tar --exclude='__pycache__' -czf "$work/package.tgz" \
            Editor Editor.meta Runtime Runtime.meta Tests Tests.meta Android Android.meta \
            iOS iOS.meta Mac Mac.meta Windows Windows.meta package.json package.json.meta
          mkdir "$work/extracted"
          tar -xzf "$work/package.tgz" -C "$work/extracted"
          bash .github/scripts/validate-apple-artifacts.sh "$work/extracted" all

  test:
    needs: validate-apple-native-artifacts
    name: Run Build for ${{ matrix.targetPlatform }} on Unity ${{ matrix.unityVersion }} ${{ matrix.macBackend }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - test-package
        unityVersion:
          - 2019.4.40f1
        targetPlatform:
          - StandaloneOSX
          - StandaloneWindows
          - StandaloneWindows64
          - StandaloneLinux64
          - iOS
          - Android
          - WebGL
        # Preserve every baseline target. Modern macOS builds use the native host toolchain.
        # game-ci installs the exact Editor and mac-il2cpp module.
        include:
          - projectPath: test-package
            unityVersion: 2022.3.56f1
            targetPlatform: StandaloneOSX
            runner: macos-15-intel
            macBackend: Mono
          - projectPath: test-package
            unityVersion: 6000.3.7f1
            targetPlatform: StandaloneOSX
            runner: macos-15-intel
            macBackend: Mono
          - projectPath: test-package
            unityVersion: 6000.3.7f1
            targetPlatform: StandaloneOSX
            runner: macos-15-intel
            macBackend: IL2CPP
          - projectPath: test-package
            unityVersion: 2022.3.56f1
            targetPlatform: iOS
            runner: macos-15-intel
            iosSdk: Device
          - projectPath: test-package
            unityVersion: 6000.3.7f1
            targetPlatform: iOS
            runner: macos-15-intel
            iosSdk: Simulator
          - projectPath: test-package
            unityVersion: 2022.3.56f1
            targetPlatform: Android
          - projectPath: test-package
            unityVersion: 6000.3.7f1
            targetPlatform: Android
            androidExportType: androidAppBundle
            configureIl2Cpp: true

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          lfs: true

      # The macOS 15 Intel image defaults to Xcode 16.4.
      # Match the supported Apple artifact toolchain explicitly for actual iOS compile/link checks.
      - name: Select Xcode 26.3 for native iOS builds
        if: matrix.iosSdk != ''
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer_dir"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version | grep -Fx 'Xcode 26.3'
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Setup Environment
        run: |
          mkdir ${{ matrix.projectPath }}
          mv Editor Runtime Tests Android iOS Mac Windows package.json ${{ matrix.projectPath }}/

      # Install only the SDK sources and plugins required by Android so the player build
      # compiles the SDK with UNITY_ANDROID and packages its native libraries.
      - name: Install SDK in Android project
        if: matrix.targetPlatform == 'Android'
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity
          mv \
            ${{ matrix.projectPath }}/Editor \
            ${{ matrix.projectPath }}/Runtime \
            ${{ matrix.projectPath }}/Android \
            ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity/

      - name: Compile SDK in macOS player builds
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity
          mv ${{ matrix.projectPath }}/Editor ${{ matrix.projectPath }}/Runtime ${{ matrix.projectPath }}/Mac ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity/

      - name: Compile SDK in modern iOS player exports
        if: matrix.iosSdk != ''
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity ${{ matrix.projectPath }}/Assets/Editor
          mv ${{ matrix.projectPath }}/Editor ${{ matrix.projectPath }}/Runtime ${{ matrix.projectPath }}/iOS ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity/
          cp .github/scripts/BacktraceCiIOSBuild.cs ${{ matrix.projectPath }}/Assets/Editor/
          mkdir -p ${{ matrix.projectPath }}/Assets/BacktraceCi
          cp .github/scripts/macos-link.xml ${{ matrix.projectPath }}/Assets/BacktraceCi/link.xml

      - name: Install iOS Editor integration tests
        if: matrix.iosSdk != ''
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity/Tests ${{ matrix.projectPath }}/Packages ${{ matrix.projectPath }}/ProjectSettings
          mv ${{ matrix.projectPath }}/Tests/Editor ${{ matrix.projectPath }}/Tests/Editor.meta ${{ matrix.projectPath }}/Assets/Plugins/backtrace-unity/Tests/
          printf 'm_EditorVersion: %s\n' '${{ matrix.unityVersion }}' > ${{ matrix.projectPath }}/ProjectSettings/ProjectVersion.txt
          cat > ${{ matrix.projectPath }}/Packages/manifest.json <<'EOF'
          {
            "dependencies": {
              "com.unity.test-framework": "1.1.33",
              "com.unity.modules.androidjni": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0"
            }
          }
          EOF

      - name: Install explicit macOS backend build fixture
        if: matrix.macBackend != ''
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Editor ${{ matrix.projectPath }}/Assets/BacktraceCi
          cp .github/scripts/BacktraceCiMacBuild.cs ${{ matrix.projectPath }}/Assets/Editor/
          cp .github/scripts/macos-link.xml ${{ matrix.projectPath }}/Assets/BacktraceCi/link.xml

      # The synthetic project has no saved scene, and game-ci then builds the untitled scene.
      # Unity 2019.4 tolerates that but 2022.3+ fails with "Cannot build untitled scene", this gives the build a registered empty scene.
      - name: Create CI build scene
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Scenes ${{ matrix.projectPath }}/ProjectSettings
          printf '%%YAML 1.1\n%%TAG !u! tag:unity3d.com,2011:\n' > ${{ matrix.projectPath }}/Assets/Scenes/Empty.unity
          cat > ${{ matrix.projectPath }}/Assets/Scenes/Empty.unity.meta <<'EOF'
          fileFormatVersion: 2
          guid: 9fc0d4010bbf28b4594072e72b8655ab
          DefaultImporter:
            externalObjects: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
          cat > ${{ matrix.projectPath }}/ProjectSettings/EditorBuildSettings.asset <<'EOF'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!1045 &1
          EditorBuildSettings:
            m_ObjectHideFlags: 0
            serializedVersion: 2
            m_Scenes:
            - enabled: 1
              path: Assets/Scenes/Empty.unity
              guid: 9fc0d4010bbf28b4594072e72b8655ab
            m_configObjects: {}
          EOF

      # Exercise the Android bridge in the modern packaging configuration without
      # requiring a release keystore or a device-side deployment.
      - name: Configure Android IL2CPP App Bundle build
        if: matrix.configureIl2Cpp == true
        run: |
          mkdir -p ${{ matrix.projectPath }}/Assets/Editor
          cat > ${{ matrix.projectPath }}/Assets/Editor/BacktraceCiAndroidSettings.cs <<'EOF'
          using UnityEditor;

          [InitializeOnLoad]
          internal static class BacktraceCiAndroidSettings
          {
              static BacktraceCiAndroidSettings()
              {
                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.Android,
                      ScriptingImplementation.IL2CPP);
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
              }
          }
          EOF

      - if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: game-ci/unity-builder@v4
        name: Build game for platform ${{ matrix.targetPlatform }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: ${{ matrix.projectPath }}/
          androidExportType: ${{ matrix.androidExportType || 'androidPackage' }}
          buildMethod: ${{ matrix.macBackend && 'BacktraceCiMacBuild.Build' || matrix.iosSdk && 'BacktraceCiIOSBuild.Build' || '' }}
          customParameters: ${{ matrix.macBackend && format('-btMacBackend {0}', matrix.macBackend) || matrix.iosSdk && format('-btIOSSDK {0}', matrix.iosSdk) || '' }}
          allowDirtyBuild: true

      - name: Require all five iOS Editor integration tests
        if: ${{ always() && matrix.iosSdk != '' }}
        run: |
          python3 .github/scripts/validate_unity_test_results.py \
            --results-root artifacts/ios-editor \
            --mode editmode \
            --require-test 'Backtrace.Unity.Tests.Editor.BacktraceXcodePostBuildTests.RepeatedPostprocessingRemovesStaticLinkageAndDuplicateEntries' \
            --require-test 'Backtrace.Unity.Tests.Editor.BacktraceXcodePostBuildTests.RepeatedPostprocessingPreservesPerConfigurationAndQuotedRunPaths' \
            --require-test 'Backtrace.Unity.Tests.Editor.BacktraceXcodePostBuildTests.AppOnlyConfigurationWithEscapedNameRetainsItsRunPaths' \
            --require-test 'Backtrace.Unity.Tests.Editor.BacktraceXcodePostBuildTests.UnsupportedMinimumIsRejectedWithoutChangingProjectOrPlayerSetting' \
            --require-test 'Backtrace.Unity.Tests.Editor.BacktraceXcodePostBuildTests.BridgeImporterEnablesARCAndDisablesHeaderAutolinkingOnlyForBridge'

      - name: Retain iOS Editor test results and logs
        if: ${{ always() && matrix.iosSdk != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-editor-${{ matrix.unityVersion }}-${{ matrix.iosSdk }}
          path: artifacts/ios-editor/
          if-no-files-found: error

      - name: Validate Android IL2CPP App Bundle contents
        if: matrix.configureIl2Cpp == true
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' app_bundles < <(find build -type f -name '*.aab' -print0)
          test "${#app_bundles[@]}" -eq 1

          entries="$RUNNER_TEMP/backtrace-aab-entries.txt"
          unzip -Z1 "${app_bundles[0]}" > "$entries"
          grep -Eq '(^|/)lib/arm64-v8a/libil2cpp\.so$' "$entries"
          grep -Eq '(^|/)lib/arm64-v8a/libbacktrace-native\.so$' "$entries"

          dex_entries=()
          while IFS= read -r entry; do
            if [[ "$entry" =~ ^base/dex/classes([0-9]+)?\.dex$ ]]; then
              dex_entries+=("$entry")
            fi
          done < "$entries"

          if (( ${#dex_entries[@]} == 0 )); then
            echo "Error: App Bundle contains no base/dex/classes*.dex entries." >&2
            exit 1
          fi

          dex_dir="$RUNNER_TEMP/backtrace-aab-dex"
          mkdir -p "$dex_dir"

          handler_class='backtraceio/library/nativeCalls/BacktraceCrashHandler'
          handler_descriptor="L${handler_class};"
          handler_found=false

          for dex_index in "${!dex_entries[@]}"; do
            dex_entry="${dex_entries[$dex_index]}"
            dex_file="$dex_dir/classes-$dex_index.dex"
            unzip -p "${app_bundles[0]}" "$dex_entry" > "$dex_file"

            if grep -aFq -- "$handler_descriptor" "$dex_file"; then
              handler_found=true
              break
            fi
          done

          if [[ "$handler_found" != true ]]; then
            echo "Error: App Bundle DEX files do not contain ${handler_class}." >&2
            printf 'Searched DEX entries:\n' >&2
            printf '  %s\n' "${dex_entries[@]}" >&2
            exit 1
          fi

      - name: Require a flat plugin in built macOS player
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bundles = list(Path('build').glob('**/Contents/PlugIns/BacktraceMacUnity.bundle'))
          assert len(bundles) == 1, bundles
          b = bundles[0]
          assert (b / 'Contents/MacOS/BacktraceMacUnity').is_file()
          assert (b / 'Contents/Resources/Model.momd/ModelV2.mom').is_file()
          assert not (b / 'Contents/Frameworks').exists()
          assert not any(p.is_symlink() for p in b.rglob('*'))
          PY

      - name: Validate built macOS native ABI and signature
        if: matrix.macBackend != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          bundles = list(Path('build').glob('**/Contents/PlugIns/BacktraceMacUnity.bundle'))
          assert len(bundles) == 1, bundles
          subprocess.run(['bash', '.github/scripts/validate-apple-artifacts.sh', '.', 'mac', str(bundles[0])], check=True)
          PY

      - name: Compile exported iOS application
        if: matrix.iosSdk != ''
        shell: bash
        run: |
          set -euo pipefail
          project=$(find build -name Unity-iPhone.xcodeproj -type d -print -quit)
          test -n "$project"
          sdk=iphoneos
          destination='generic/platform=iOS'
          if [[ '${{ matrix.iosSdk }}' == Simulator ]]; then
            sdk=iphonesimulator
            destination='generic/platform=iOS Simulator'
          fi
          xcodebuild -project "$project" -scheme Unity-iPhone -configuration Release \
            -sdk "$sdk" -destination "$destination" -derivedDataPath "$RUNNER_TEMP/backtrace-ios-build" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
